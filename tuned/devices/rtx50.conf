# tuned/devices/rtx50.conf — static device config for RTX 50 (Blackwell
# consumer, sm_120). x86_64 + Blackwell consumer is already part of vLLM's
# standard CUDA_SUPPORTED_ARCHS (CMakeLists.txt) with full upstream PyPI
# wheel support, so the normal requirements/cuda.txt path applies unchanged
# -- see tuned/devices/gb10.conf for the contrast.
#
# "a" suffix (12.0a) targets the Blackwell family-specific SASS variant --
# same rationale as GB10's 12.1a -- required for RTX 50-specific tensor
# core instructions not present in the compatible/generic sm_120 target.

GPU_TUNED_VARIANT="rtx50"
GPU_TUNED_TORCH_ARCH="12.0a"
GPU_TUNED_HW_LABEL="RTX 50-series (Blackwell consumer, desktop/laptop, sm_120a)"
GPU_TUNED_NEEDS_PREBUILT_DEPS="false"
