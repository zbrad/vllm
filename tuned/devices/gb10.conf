# tuned/devices/gb10.conf — static device config for GB10 (DGX Spark,
# sm_121). See tuned/devices/rtx50.conf for the 12.1a/12.0a
# family-specific-suffix rationale.

GPU_TUNED_VARIANT="gb10"
GPU_TUNED_TORCH_ARCH="12.1a"
GPU_TUNED_HW_LABEL="DGX Spark (GB10, sm_121)"

# GB10 is NOT part of vLLM's standard supported arch matrix -- no official
# aarch64/sm_121 upstream wheel exists for torch or flash-attention, so this
# variant consumes prebuilt personal-fork wheels instead of building them.
# rtx40/rtx50 need none of this (see those confs).
GPU_TUNED_NEEDS_PREBUILT_DEPS="true"
# Filename changed this cycle: zbrad/flash-attention's tuned/wheel.sh now
# sets FLASH_ATTN_LOCAL_VERSION="<variant>.cu<NNN>" (was bare "cu<NNN>")
# to disambiguate multiple tuned variants at the same CUDA version -- same
# release tag, new asset name.
GPU_TUNED_FLASH_ATTN_WHEEL_URL="https://github.com/zbrad/flash-attention/releases/download/v2.7.2.post1-gb10-cu133/vllm_flash_attn-2.7.2.post1%2Bgb10.cu133-cp314-cp314-linux_aarch64.whl"
