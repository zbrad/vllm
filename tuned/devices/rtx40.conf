# tuned/devices/rtx40.conf — static device config for RTX 40 (Ada Lovelace,
# sm_89). x86_64 + Ada Lovelace is already part of vLLM's standard
# CUDA_SUPPORTED_ARCHS (CMakeLists.txt) with full upstream PyPI wheel
# support, so the normal requirements/cuda.txt path applies unchanged --
# see tuned/devices/gb10.conf for the contrast. Ada Lovelace has no "a"
# (family-specific) SASS variant -- unlike Blackwell, there's nothing
# beyond the compatible/generic sm_89 target to opt into.

GPU_TUNED_VARIANT="rtx40"
GPU_TUNED_TORCH_ARCH="8.9"
GPU_TUNED_HW_LABEL="RTX 4080/4090 (Ada Lovelace, sm_89)"
GPU_TUNED_NEEDS_PREBUILT_DEPS="false"
